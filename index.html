<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#202a31"><meta name="description" content="Máy tính khoa học web ngoại tuyến, lấy fx-580VN X làm tham chiếu.">
  <link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles/base.css"><link rel="stylesheet" href="styles/calculator.css">
  <title>Máy tính khoa học — bản phát triển</title>
</head>
<body>
<main class="device" aria-label="Máy tính khoa học">
  <header class="brand"><div><strong>CLASSWIZ</strong><small>SCIENCE / MATH</small></div><span>fx-580VN X · WEB</span></header>
  <section class="lcd" aria-label="Màn hình tính toán">
    <div class="indicators"><span id="angle">DEG</span><span id="mode-indicator">Calculate</span><span id="shift-indicator"></span></div>
    <div id="expression" class="expression" aria-live="polite">0</div>
    <div id="result" class="result" aria-live="polite"> </div>
    <div id="message" class="message" role="status"></div>
  </section>
  <nav class="utility"><button data-action="menu">MENU</button><button data-action="angle">DEG/RAD</button><button data-action="history">HISTORY</button><button data-action="reset">RESET</button></nav>
  <section id="keypad" class="keypad" aria-label="Bàn phím">
    <button class="key function" data-insert="sin(" data-shift="asin(">sin</button><button class="key function" data-insert="cos(" data-shift="acos(">cos</button><button class="key function" data-insert="tan(" data-shift="atan(">tan</button><button class="key function" data-insert="log(" data-shift="10^(">log</button><button class="key function" data-insert="ln(" data-shift="e^(">ln</button>
    <button class="key function" data-insert="sqrt(">√</button><button class="key function" data-insert="^2">x²</button><button class="key function" data-insert="^">xʸ</button><button class="key function" data-insert="(">(</button><button class="key function" data-insert=")">)</button>
    <button class="key" data-insert="7">7</button><button class="key" data-insert="8">8</button><button class="key" data-insert="9">9</button><button class="key operator" data-insert="÷">÷</button><button class="key function" data-action="delete">DEL</button>
    <button class="key" data-insert="4">4</button><button class="key" data-insert="5">5</button><button class="key" data-insert="6">6</button><button class="key operator" data-insert="×">×</button><button class="key function" data-action="clear">AC</button>
    <button class="key" data-insert="1">1</button><button class="key" data-insert="2">2</button><button class="key" data-insert="3">3</button><button class="key operator" data-insert="−">−</button><button class="key function" data-insert="Ans">Ans</button>
    <button class="key" data-insert="0">0</button><button class="key" data-insert=".">.</button><button class="key" data-insert="π">π</button><button class="key operator" data-insert="+">+</button><button class="key exe" data-action="execute">EXE</button>
  </section>
  <footer>Ứng dụng độc lập · Không gửi dữ liệu ra ngoài</footer>
</main>
<dialog id="menu-dialog"><form method="dialog"><h2>Chọn chế độ</h2><p class="note">Danh sách theo tài liệu fx-580VN X. Trong bản khởi đầu, chỉ Calculate được triển khai; các chế độ còn lại chưa được giả làm chức năng hoàn chỉnh.</p><div id="mode-list" class="mode-list"></div><button class="close">Đóng</button></form></dialog>
<dialog id="history-dialog"><form method="dialog"><h2>Lịch sử</h2><div id="history-list"></div><button class="close">Đóng</button><button type="button" id="clear-history">Xóa lịch sử</button></form></dialog>
<script src="src/core/parser.js"></script><script src="src/state/state.js"></script><script src="src/app.js"></script>
</body></html>
