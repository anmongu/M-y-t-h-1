<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiểm thử lõi</title><body><h1>Kết quả kiểm thử lõi</h1><p>Các kiểm thử được chạy trong trình duyệt. Đây không phải chứng nhận tương đương firmware Casio.</p><pre id="out">Đang chạy...</pre><script src="../src/core/parser.js"></script><script>
const cases=[['T01','2+3*4',14],['T02','(2+3)*4',20],['T03','-2^2',-4],['T04','2^3^2',512],['T05','sqrt(81)',9],['T06','log(100)',2],['T07','ln(e)',1],['T08','sin(30)',0.5],['T09','5!',120],['T10','2(3+4)',14],['T11','1/0',null],['T12','sqrt(-1)',null]];let pass=0;const rows=[];for(const [id,input,expected] of cases){let actual,error='';try{actual=CalculatorCore.calculate(input,{angle:'DEG',ans:0}).value;}catch(e){error=e.message;}const ok=expected===null?!!error:!error&&Math.abs(actual-expected)<1e-9;if(ok)pass++;rows.push(`${id} | ${input} | expected=${expected} | actual=${error||actual} | ${ok?'PASS':'FAIL'}`);}document.getElementById('out').textContent=`Tổng: ${cases.length} | PASS: ${pass} | FAIL: ${cases.length-pass}\n\n`+rows.join('\n');
</script></body></html>
